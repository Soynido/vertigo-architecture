<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 925" width="1120" height="925" role="img" aria-labelledby="title description">
<title id="title">OS, plugin, agent, connecteurs et harness : circuit hybride</title>
<desc id="description">Le plugin fournit des compétences à l’agent dans ChatGPT. L’agent appelle les connecteurs natifs et le harness. Les connecteurs lisent ou écrivent dans les sources Notion autorisées. Le harness contrôle les appels reçus et effectue des relectures ciblées ; il ne voit pas tous les appels privés. META et SALES organisent la mémoire durable.</desc>
