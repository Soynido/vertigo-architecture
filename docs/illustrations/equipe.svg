<text x="54" y="650" font-size="24" fill="#245f4b" font-weight="700" class="">Pourquoi c’est utile</text>
<text x="54" y="687" font-size="21" fill="#263b35" font-weight="400" class="">Julian retrouve les informations de son lot sans devoir ouvrir le Sales OS d’Aron. Avant</text>
<text x="54" y="716" font-size="21" fill="#263b35" font-weight="400" class="">contact, il conserve les contrôles de responsable, d’historique et de refus.</text>
<text x="54" y="759" font-size="17" fill="#596b64" font-weight="400" class="">Document présent dans Notion ; chargement et contacts réalisés à prouver séparément.</text>
<text x="30" y="818" font-size="15" fill="#596b64" font-weight="400" class="">Documentation privée · Cas réels et mécanismes documentés · Sources détaillées dans la page</text>
