<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="1120" height="840" role="img" aria-labelledby="title description">
<title id="title">Célia, Aron et Julian : des espaces de travail distincts</title>
<desc id="description">Célia est présentée comme manager META. Aron et Julian utilisent leurs SALES OS. La répartition historique des 73 prospects attribue les rangs 1 à 25 à Aron, 26 à 52 à Célia et 53 à 73 à Julian. Le document de Julian existe dans son OS ; sa présence ne prouve pas sa consommation par son agent.</desc>
